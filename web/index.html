<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friday</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  button { font-size: 1.1rem; padding: .6rem 1.4rem; border-radius: 999px; border: 1px solid #8884; cursor: pointer; }
  button.on { background: #d33; color: #fff; }
  #log { margin-top: 1.5rem; display: flex; flex-direction: column; gap: .4rem; }
  .msg { padding: .5rem .8rem; border-radius: .6rem; max-width: 85%; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2a7fff22; }
  .bot { align-self: flex-start; background: #8883; }
  .tool { align-self: center; font-size: .8rem; opacity: .7; font-family: monospace; }
  #state { font-size: .85rem; opacity: .7; margin-left: 1rem; }
</style>
</head>
<body>
<h1>Friday</h1>
<button id="btn">Start talking</button><span id="state">idle</span>
<div id="log"></div>
<script type="module">
const OUT_RATE = 24000;
const btn = document.getElementById('btn'), state = document.getElementById('state'), log = document.getElementById('log');
let ws, ctx, stream, node, playHead = 0, playing = new Set(), current = { user: null, bot: null };

function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight); return d;
}
function append(role, text) { if (!current[role]) current[role] = add(role, ''); current[role].textContent += text; }

function play(pcm) {
  const i16 = new Int16Array(pcm), buf = ctx.createBuffer(1, i16.length, OUT_RATE), ch = buf.getChannelData(0);
  for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 0x8000;
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  const at = Math.max(ctx.currentTime + 0.02, playHead);
  src.start(at); playHead = at + buf.duration;
  playing.add(src); src.onended = () => playing.delete(src);
}
function flush() { for (const s of playing) { try { s.stop(); } catch {} } playing.clear(); playHead = 0; }

async function start() {
  state.textContent = 'connecting';
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule('/capture-worklet.js');
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/audio`);
  ws.binaryType = 'arraybuffer';
  await new Promise((ok, err) => { ws.onopen = ok; ws.onerror = err; });

  node = new AudioWorkletNode(ctx, 'capture');
  node.port.onmessage = e => ws.readyState === 1 && ws.send(e.data);
  ctx.createMediaStreamSource(stream).connect(node);

  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) return play(e.data);
    const m = JSON.parse(e.data);
    switch (m.type) {
      case 'user_text': current.bot = null; append('user', m.data); break;
      case 'bot_text': current.user = null; append('bot', m.data); break;
      case 'turn_complete': current.user = current.bot = null; break;
      case 'interrupted': flush(); current.bot = null; break;
      case 'tool_call': add('tool', `→ ${m.data.name}(${JSON.stringify(m.data.args)})`); break;
      case 'tool_result': add('tool', `← ${m.data.name}: ${JSON.stringify(m.data.result)}`); break;
      case 'closed': add('tool', `session closed: ${m.data ?? ''}`); stop(true); break;
    }
  };
  ws.onclose = () => stop(true);
  state.textContent = 'live'; btn.textContent = 'Stop'; btn.classList.add('on');
}
// drain=true (server ended the conversation): stop the mic now but let queued speech finish playing.
function stop(drain = false) {
  stream?.getTracks().forEach(t => t.stop()); node?.disconnect(); ws?.close();
  const c = ctx; ws = ctx = stream = node = null;
  btn.textContent = 'Start talking'; btn.classList.remove('on'); state.textContent = 'idle';
  if (!c) return;
  const wait = drain ? Math.max(0, playHead - c.currentTime) * 1000 : 0;
  if (!drain) flush();
  setTimeout(() => { playing.clear(); playHead = 0; c.close(); }, wait);
}
btn.onclick = () => ws ? stop() : start().catch(e => { console.error(e); state.textContent = 'error: ' + e.message; stop(); });
</script>
</body>
</html>
