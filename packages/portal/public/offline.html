<!doctype html>
<!--
  Shown by public/sw.js when a page can't be loaded because the server can't be reached. Self-contained: it can't
  load anything else while offline, and it needs no script. The address stays the page that was asked for, so Retry
  (a link to that address) loads it again.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1217" />
    <title>Friday can't be reached</title>
    <style>
      html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #0f1217;
        color: #d2d7e0;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 26rem; display: flex; flex-direction: column; gap: 1rem; }
      .mark { width: 3rem; height: 3rem; border-radius: 0.75rem; background: #3b82f6; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 1.5rem; }
      h1 { margin: 0; font-size: 1.375rem; font-weight: 600; color: #f7f9fc; }
      p { margin: 0; color: #8c96a8; }
      .retry {
        align-self: flex-start;
        border: 0;
        border-radius: 999px;
        padding: 0.625rem 1.25rem;
        background: #3b82f6;
        color: #fff;
        font: inherit;
        font-weight: 500;
        text-decoration: none;
      }
      .retry:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">F</span>
      <h1>Friday can't be reached</h1>
      <p>The server didn't answer. Check that you're on a network that can reach Friday, then try again.</p>
      <a class="retry" href="">Retry</a>
    </main>
  </body>
</html>
