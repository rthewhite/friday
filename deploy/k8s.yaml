# Workloads for the friday namespace. Applied by .github/workflows/deploy.yml
# with ${IMAGE_TAG} replaced by the commit SHA.
#
# Namespace, deployer ServiceAccount, RBAC and the registry-pull secret are
# created by the homelab Ansible (app-namespaces role), not here. The
# application secret referenced below (friday-secrets) is created by hand — the
# deployer is deliberately denied access to Secrets. See infra/README.md.
# MCP servers are configured in the portal and stored in friday.db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: friday
  namespace: friday
spec:
  replicas: 1
  # A Gemini Live session lives on one pod for its whole duration, so replace
  # rather than roll: two pods would split the Voice PE and browser clients
  # across images mid-conversation. Downtime is a few seconds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: friday
  template:
    metadata:
      labels:
        app: friday
    spec:
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: friday
          image: registry.thewhite.nl/friday/friday:${IMAGE_TAG}
          # Immutable SHA tags make IfNotPresent correct and cheap.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: FRIDAY_HOST
              value: "0.0.0.0"
            - name: FRIDAY_PORT
              value: "8080"
            - name: FRIDAY_DATA_DIR
              value: /data
          # GEMINI_API_KEY and FRIDAY_MASTER_KEY are required here. Module config
          # (JELLYFIN_*, HA_*, TOMTOM_API_KEY, ICLOUD_*) and FRIDAY_MODULE_KEYS may also live here as a
          # fallback, but the portal's Settings pages are the primary place now.
          envFrom:
            - secretRef:
                name: friday-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        # friday.db: encrypted configuration, remote module keys, module storage.
        # Single replica + Recreate, so one RWO claim is enough.
        - name: data
          persistentVolumeClaim:
            claimName: friday-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: friday-data
  namespace: friday
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: friday
  namespace: friday
spec:
  selector:
    app: friday
  ports:
    - port: 8080
      targetPort: 8080
---
# Browser UI + WebSocket over TLS. Browsers only allow the microphone on HTTPS.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: friday
  namespace: friday
spec:
  entryPoints:
    - websecure
  routes:
    # Whole host over TLS: the portal, /api/*, /ws/audio for browsers and voice
    # devices (wss://friday.thewhite.nl/ws/audio), and /ws/modules for remote
    # modules (wss://friday.thewhite.nl/ws/modules).
    - match: Host(`friday.thewhite.nl`)
      kind: Rule
      services:
        - name: friday
          port: 8080
