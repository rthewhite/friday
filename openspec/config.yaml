schema: spec-driven

context: |
  Friday: a voice assistant on Gemini Live (TypeScript / Node, ESM, @google/genai), built as a
  small core that hosts modules. pnpm workspace: packages/sdk (@friday/sdk: module contract,
  ToolRegistry, createTestHost), packages/core (@friday/core: HTTP, /ws/audio, GeminiSession,
  ModuleHost, MCP source), modules/* (one package per module, depending only on the sdk).
  A module exports defineModule({ manifest: { id, label, config[] }, init(ctx) }); ctx gives
  defineTool, config (env-backed), log. Core lists in-process modules in packages/core/src/modules.ts,
  FRIDAY_MODULES narrows them, GET /api/modules reports status. Tools live in one owner-tagged
  ToolRegistry instance (owner = module id or mcp:<server>); a tool may set channels (voice | chat,
  both by default; end_conversation and core's timer tools are voice-only); each GeminiSession snapshots
  declarations("voice") at open (Gemini binds tools then). Tool results may carry reserved keys
  scheduling (INTERRUPT | WHEN_IDLE | SILENT) and endConversation (reason string), both stripped
  before reaching Gemini (and ignored in chat). Handlers get a second argument, the call context { channel?,
  conversationId?, device? } from callTool's options: voice and chat pass their channel and the recorder's conversation id
  (absent in a voice session's first exchange, which is stored at its turn end), a registered device's voice session
  also its device id; MCP and remote tools never see it. Portal chat (packages/core/src/chat/): POST /api/chat
  runs one turn per message on the text model (FRIDAY_CHAT_MODEL, else FRIDAY_TEXT_MODEL) through
  LlmService.streamCall, replaying the thread's whole stored history (tool entries as function
  call/response pairs), a tool loop over declarations("chat") (FRIDAY_CHAT_TOOL_TIMEOUT_MS, 10 rounds),
  recorded as a `chat` conversation, streamed as server-sent events. Transports (WebSocket /ws/audio, raw PCM 16k in / 24k out) wrap the
  transport-agnostic GeminiSession; a ?device= connection gets only audio and interrupted/turn_complete/closed, the
  browser also gets transcripts and tool events. MCP servers (streamable HTTP only, no stdio) are stored in friday.db (mcp_servers; secret header
  values encrypted like config secrets), managed via /api/mcp/servers and Settings > Configuration > MCP servers, and
  connected per server by packages/core/src/tools/mcp.ts (store: mcp-store.ts). Remote modules (remote/*,
  e.g. simracing on the gaming PC) run the same module via runRemote from @friday/sdk/remote: they dial
  /ws/modules, authenticate with FRIDAY_MODULE_KEYS, serve MCP over the socket; core registers their tools
  as <id>__<tool> with owner remote:<id> for the life of the connection (packages/core/src/remote/).
  Integrations: Jellyfin (REST), Home Assistant (REST, controls an Apple TV running Infuse), TomTom
  (modules/travel, id travel: get_travel_time, car travel time with traffic via Orbis Places Search v1 and
  Routing v2; TOMTOM_API_KEY required secret, sent as a query parameter so URLs are never logged; geocodes
  cached in memory (LRU, hits 24h, misses 10 min), routes never; client rebuilt when the key changes, no
  reload needed; offset-less departAt/arriveAt read in FRIDAY_TIMEZONE, past times refused).
  Calendar: modules/calendar (id calendar) has two optional sources and loads when at least one has both keys
  (checked in init). The Work calendar (src/work.ts, src/intake.ts): INTAKE_URL + secret INTAKE_KEY; the
  calendar/refresh job POSTs {"subject":"calendar"} with a bearer key (redirects refused, 30 s) to the homelab intake,
  which returns {messages:[{id, subject, received_at, content}]} and deletes them, so the newest usable delivery
  (offset date-times required) is stored in ctx.storage "work-snapshot" before use and an empty poll keeps it. Items
  are Outlook calendar-view occurrences (Power Automate, hourly, 1 month back / 6 ahead = COVERAGE), mapped on read:
  all-day dates as written, Geannuleerd/Canceled prefix -> status cancelled, showAs -> tentative|free|out of office,
  links/"Microsoft Teams Meeting" -> "online", rooms without leading "_"; ids from title+start+end. It is one read-only
  CalendarInfo (source "intake", id intake-work, "Work" or "Work (Outlook)" on a clash) after iCloud's; edits refused
  before any iCloud request; free/cancelled never overlaps; list adds `coverage` outside the window and `unavailable`
  when iCloud failed but Work was listed (CalendarService.collect). Only one Friday may hold the intake keys (k8s
  `intake` Secret). iCloud: CalDAV to one account (src/caldav.ts, own client over
  injectable fetch + fast-xml-parser; Basic auth only to https *.icloud.com, redirects followed by hand;
  ICLOUD_USERNAME and secret ICLOUD_APP_PASSWORD, an app-specific password, read per request) and ical.js
  (src/ical.ts: expansion with EXDATE/overrides, IANA TZIDs via Intl, edits keep unknown properties, generated
  VTIMEZONE in src/vtimezone.ts). Tools on voice and chat: calendar_list_events (short in-memory ids, 2h, src/handles.ts),
  calendar_create_event (immediate), calendar_update_event / calendar_delete_event (preview + single-use 5-minute
  token holding the exact conditional request, src/tokens.ts; scope occurrence|series; series only shift time of day;
  invitations and read-only calendars refused), calendar_confirm (If-Match; 412 -> StaleEventError with the current
  version), calendar_undo (newest tool change of the last 24h). Every write is logged in calendar__changes (whole
  before/after ICS, source, conversation id; 500 kept; undo rows action "undo"). Job calendar/refresh (5 min, also
  after writes) polls the intake and caches three local days of iCloud, each failing on its own (the job fails only
  when all configured sources did); the prompt provider (src/agenda.ts) renders today and tomorrow at build time
  (Work from the snapshot; status and [calendar] labels when more than one calendar is in the agenda; per-source
  unavailable/stale notes, Work stale after 3 h), 2000 chars. Per-calendar use/inAgenda and the default in
  ctx.storage "settings". Portal /m/calendar (Overview with iCloud and Work rows, Changes); routes status (icloud,
  work, calendar source), settings, agenda, changes, changes/:id/undo, refresh. Fakes for tests in
  test/fake-icloud.ts and test/fake-intake.ts (fixtures in test/fixtures/intake).
  Memory: modules/brain (id brain) keeps one household brain in brain__* tables (pages, names, revisions,
  tombstones; BrainStore in src/store.ts, every write one writeRevision with author system|user|remember|
  extraction|consolidation). Tools brain_remember (append-only dated notes under ## Notes) and brain_recall
  (name/alias match plus substring search), and brain_recall_conversations (ctx.conversations.search with
  brain_recall's word rules, YYYY-MM-DD since/until as whole days in FRIDAY_TIMEZONE via startOfLocalDay, the
  call's own conversation excluded, 5 conversations, 8000 JSON chars, never tool results); its prompt context (profile + index of 50 recent pages, under 10000
  chars) goes into every voice/chat prompt; no tool deletes. Portal /m/brain curates (edit with stale check,
  history/restore, soft delete, purge with tombstones); routes under /api/modules/brain/. The job brain/nightly
  (src/nightly/, BRAIN_NIGHTLY_CRON) extracts sourced notes from quiet conversations (watermark and progress in
  ctx.storage, tool results never sent) and consolidates with one validated all-or-nothing plan (declared drops,
  mechanical loss check that also accepts a removed line stated on an untouched page the line names, one repair
  round); runs are recorded in brain__runs and reviewed/reverted in the Nightly tab (/api/modules/brain/runs).
  The profile is a summary backed by entity pages: facts go on the entity they're about (also in the first person),
  and consolidation moves entity detail off the profile whatever the budget (guidance in src/nightly/guidance.ts).
  GUIDANCE_VERSION there, stored as consolidate:guidance in ctx.storage, makes the next run reconsider the profile
  once after a guidance change; bump it when existing brains should be redone. Fixtures in test/fixtures/nightly;
  `pnpm --filter @friday/module-brain eval`.
  Portal (packages/portal): Vue 3 + Vite + Tailwind 4 SPA served by core from packages/portal/dist
  (FRIDAY_WEB_DIR) with SPA fallback; pages Talk (voice client, AudioWorklet in public/), Chat
  (/chat, /chat/:id; markdown-it with HTML off), Conversations, Modules, and
  /m/<id> per module UI. Module UIs are declared with "friday": { "ui": ... } in the module package.json and
  defineModuleUi from @friday/portal-ui (tokens + base components); scripts/gen-modules.mjs generates the
  import list at build time (no Module Federation). Modules add backend routes with ctx.http.route, served
  at /api/modules/<id>/...; core routing lives in packages/core/src/{router,app}.ts.
  Platform storage: core owns friday.db (node:sqlite, FRIDAY_DATA_DIR, PVC in k8s; packages/core/src/storage)
  with versioned migrations; modules get ctx.storage (module_kv). Conversations (packages/core/src/conversations/,
  ctx.conversations list/get/search/onQuiet) are indexed by migration 6: contentless trigram FTS5 conversation_search
  keyed by conversation_entries.id (an explicit INTEGER PRIMARY KEY, stable across VACUUM), kept by triggers, over text and tool name + argument values (never keys or results); search is one MATCH per
  word (3+ chars), ranked by distinct words then recency, with snippets built by @friday/sdk's shared
  conversation-search rules (MemoryConversations uses them too). In-process modules may also declare numbered
  migrations (run before init, versions in module_schema) and use ctx.db: a synchronous node:sqlite handle
  (prepare/exec/transaction, nested = savepoints, async bodies refused) on the module's own connection, whose
  authorizer allows only <id with - as _>__* objects (no core tables, pragmas or ATTACH); shared code in
  packages/sdk/src/db.ts (@friday/sdk/db), never loaded by @friday/sdk/remote. ctx.prompt.addContext registers a
  synchronous provider ({ channel }) whose text core appends to the voice prompt at session open and the chat
  prompt per turn, in module load order, capped per module by FRIDAY_PROMPT_CONTEXT_MAX_CHARS
  (packages/sdk/src/prompt.ts, packages/core/src/prompt-context.ts). Remote hosts reject ctx.db and ctx.prompt.
  Household zone: FRIDAY_TIMEZONE, default and invalid-value fallback Europe/Amsterdam everywhere, resolved by
  @friday/sdk's time helper (packages/sdk/src/time.ts: DEFAULT_TIME_ZONE, resolveTimeZone, localDate,
  householdTimeZone(ctx.config, warn) reading per call and warning once, startOfLocalDay, and parseDateTime(value, zone):
  strict ISO 8601 with optional RFC 3339 offset, offset-less read in the zone, used by travel and calendar;
  offsetMinutes/formatOffset). Core declares it too; the scheduler
  resolves it like core's keys (core scope, global, env) and refreshTimezone() re-plans cron jobs when the config
  API saves or clears it (AppDeps.onConfigChange → followTimezone). The portal drawer preselects the stored
  scope, else the sole requester, else global (packages/portal/src/lib/config-scope.ts). Never hard-code the zone.
  Configuration values are plain (plaintext, visible in the
  portal) or secret (manifest config key `secret: true`; AES-256-GCM with FRIDAY_MASTER_KEY, write-only)
  (packages/core/src/secrets); ctx.config resolves module scope, then global,
  then env, lazily; /api/config lists declared keys with status set|pending|env (plus `stored`: every scope holding
  the key, global first, plain values only, so module overrides are visible and clearable) and the portal's Settings >
  Configuration edits them; POST /api/modules/:id/reload re-initializes a module. Remote module keys are issued
  in the portal (/api/keys, hashed in module_keys) with FRIDAY_MODULE_KEYS as fallback (CompositeKeyStore).
  Env vars are documented in .env.example. Keep the total tool count modest (Gemini caps at 512).
  Voice devices (packages/core/src/devices/, migration 7: devices + device_attempts) are onboarded by trust on
  first use: the device generates its own key (NVS), /ws/audio?device=<id> must send Authorization: Bearer <key>,
  checked in serveWs before any Gemini session (4400 bad device, 4401 unauthorized for no key or revoked,
  4403 pending approval for an unknown id or different key, recorded as a pending attempt: one per id, 24h, max 20).
  Keys are SHA-256 hashed; fingerprint = first 8 hex of the hash as xxxx-xxxx, also computed by the firmware.
  Settings > Voice devices (/settings/devices, /api/devices) accepts (with the fingerprint seen, 409 if stale),
  ignores, edits label/area/notes, replaces keys, revokes and deletes; DeviceSessions closes a device's sockets
  with 4401 on revoke/delete/replace. A device session's voice prompt ends with a "## Where you are" block
  (label, its Home Assistant area as the default for requests naming no room, notes), from the snapshot taken at
  accept, via systemPrompt(context, "voice", device). Connections without ?device= (the Talk page) need no key.
  Device auth is shared by /ws/audio and /ws/device (transports/device-auth.ts).
  Alerts (packages/core/src/alerts/, migration 8: alerts): timers that ring a device. Each device keeps a control
  connection at /ws/device (transports/device-ws.ts; DeviceLinks in devices/links.ts, one per device, a newer one
  closes the older with 4409; "online" in /api/devices) carrying ring/stop to the device and ringing_locally/
  acknowledged/unanswered back. AlertService (service.ts) wakes on one re-planned timer, rings a device only while it
  is online and has no audio session (DeviceSessions.onIdle / DeviceLinks.onOnline re-check), counts unanswered rings
  (FRIDAY_ALERT_RINGS, FRIDAY_ALERT_RING_INTERVAL_MS) and misses alerts no ring could start for within
  FRIDAY_ALERT_GRACE_MS. The device answers with /ws/audio?device=&alert=<id>: AlertService.claim() (4410 alert gone
  when not ringing) makes it an alert session, GeminiSession options opening (tone.ts PCM, then an unrecorded
  opening.ts turn) and awaitUser (end requests dropped and idle close "ended: no answer" until the user's first input,
  which acknowledges). Core-owned voice tools set_timer (needs call.device with an open control connection, language
  nl|en), list_timers, cancel_timer, snooze_alert (the device's open claim) in alerts/tools.ts; /api/alerts and
  Settings > Alerts. Firmware: friday_client's second websocket client for /ws/device and the ringing state.
  Clients: browser and ESP32 satellites (esphome/) on the same WebSocket protocol: the Voice PE
  (friday-voice-pe.yaml) and the reSpeaker XVF3800 (friday-respeaker.yaml), both on the friday_client
  component. The reSpeaker adds two components: xvf3800 (I2C hub for XVF3800 firmware 1.0.9 only: version check,
  routing, mute polled from GPO 30 and kept in flash, LED ring light platform) and decimating (48 -> 16 kHz FIR
  microphone). Their pure headers (xvf3800_protocol.h, decimator.h) have plain C++17 host tests run by
  esphome/test/run.sh, outside pnpm test and CI. The firmware isn't built in CI. One container image
  built with pnpm deploy; tests use node:test via `pnpm test`.

