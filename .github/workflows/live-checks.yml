# Weekly check against the real Gemini model: core's live tests and the brain eval.
#
# FRIDAY_TEXT_MODEL is left unset on purpose: its default, gemini-flash-latest, is an alias Google moves to newer
# models, so behaviour can change without a commit here. A failed run is a signal (GitHub mails it), not a gate:
# this workflow builds, pushes and deploys nothing. Re-run it by hand to tell a bad sample from real drift.
#
# Required repository secret: GEMINI_API_KEY (see infra/README.md).

name: live-checks

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  live:
    runs-on: [self-hosted, homelab]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      # Without the key the live tests would be skipped, which looks green.
      - name: Require the Gemini key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set (see infra/README.md)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Core's live tests
        run: pnpm --filter @friday/core test:live
      - name: Brain eval
        if: ${{ !cancelled() }}
        run: pnpm --filter @friday/module-brain eval
