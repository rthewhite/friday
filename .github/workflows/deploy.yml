# Build and deploy friday to the homelab cluster.
#
# Test + typecheck + the firmware's host tests run on every push. The image is
# built on every push that touches runtime files (any branch), and pushed only
# after it passed the boot check (scripts/smoke.sh). Deploy runs only on main.
# Firmware-only pushes run firmware.yml instead.
# Same shape as rthewhite/jarvis, collapsed to a single service.
#
# Required repository secrets (see infra/README.md):
#   HOMELAB_REGISTRY_USER / HOMELAB_REGISTRY_PASSWORD   push creds for registry.thewhite.nl/friday/**
#   HOMELAB_KUBE_SERVER / HOMELAB_KUBE_CA               cluster endpoint + CA
#   HOMELAB_KUBE_TOKEN                                  deployer ServiceAccount token, friday namespace

name: deploy

on:
  push:
    paths:
      - packages/**
      - modules/**
      - remote/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - Dockerfile
      - .dockerignore
      - deploy/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.thewhite.nl
  IMAGE: registry.thewhite.nl/friday/friday
  NAMESPACE: friday
  # The firmware's host tests compile here; the runner has Docker but no compiler. Keep in step with firmware.yml.
  GCC_IMAGE: gcc:14@sha256:435c3cbc2ad1c25fbc1684c367808ff0ca2035a1bed56734a40165ab5cd7e3bd

jobs:
  test:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Also checks the firmware against core's device protocol fixture, so a core-side protocol change fails here.
      - name: Firmware host tests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w:ro" -w /w "$GCC_IMAGE" sh esphome/test/run.sh

  build:
    needs: test
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the registry
        run: |
          echo "${{ secrets.HOMELAB_REGISTRY_PASSWORD }}" \
            | docker login "$REGISTRY" -u "${{ secrets.HOMELAB_REGISTRY_USER }}" --password-stdin

      # Tag by commit SHA, never :latest — an immutable tag is what makes
      # "what is running?" answerable and `kubectl rollout undo` meaningful.
      - name: Build
        run: |
          docker buildx build \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --load \
            .

      # The image has to start, serve the portal, load every module and stop
      # cleanly before it is pushed, so a broken image never reaches the registry.
      - name: Boot check
        run: scripts/smoke.sh "$IMAGE:${GITHUB_SHA}"

      - name: Push
        run: docker push "$IMAGE:${GITHUB_SHA}"

      - name: Log out of the registry
        if: always()
        run: docker logout "$REGISTRY"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v7

      - name: Write a short-lived kubeconfig
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          cat > "$RUNNER_TEMP/kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: homelab
              cluster:
                server: ${{ secrets.HOMELAB_KUBE_SERVER }}
                certificate-authority-data: ${{ secrets.HOMELAB_KUBE_CA }}
          users:
            - name: deployer
              user:
                token: ${{ secrets.HOMELAB_KUBE_TOKEN }}
          contexts:
            - name: homelab
              context:
                cluster: homelab
                user: deployer
                namespace: ${{ env.NAMESPACE }}
          current-context: homelab
          EOF
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Deploy the SHA-tagged image
        run: |
          sed "s|\${IMAGE_TAG}|${GITHUB_SHA}|g" deploy/k8s.yaml \
            | kubectl apply -f - -o name | tee applied.txt
          grep '^deployment' applied.txt \
            | xargs -r -n1 kubectl rollout status --namespace="$NAMESPACE" --timeout=180s

      - name: Report what is running
        run: |
          echo "deployed image: $(kubectl -n "$NAMESPACE" get deploy friday \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

      - name: Remove the kubeconfig
        if: always()
        run: shred -u "$RUNNER_TEMP/kube/config" 2>/dev/null || rm -f "$RUNNER_TEMP/kube/config"
