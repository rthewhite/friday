[project]
name = "friday"
version = "0.1.0"
description = "Voice assistant on Gemini 3.8 Live with pluggable tools and transports"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.30",
    "aiortc>=1.9",
    "av>=12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
friday = "friday.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]
