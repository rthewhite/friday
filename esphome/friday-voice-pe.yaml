# Friday on the Home Assistant Voice Preview Edition.
#
# Thin fork of esphome/home-assistant-voice-pe home-assistant-voice.yaml
# at commit d4e6fa43d6a1a7d342b7d4d403567e06516719de. Hardware sections
# (esp32, i2s, microphone, speaker, DAC, XMOS voice_kit, LEDs, button, dial,
# mute switch) are kept as upstream; the Home Assistant voice pipeline, wake
# word, media player, timers, jack handling and sounds are removed. The
# friday_client component (components/friday_client) speaks Friday's
# /ws/audio protocol directly.
#
# Setup: cp secrets.yaml.example secrets.yaml, edit friday_host below, then
#   esphome run friday-voice-pe.yaml

substitutions:
  name: friday-voice
  friendly_name: Friday Voice
  friday_host: "192.168.1.191"   # host or IP running the Friday server
  friday_port: "8080"
  hidden_ssid: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  on_boot:
    priority: 375
    then:
      - script.execute: control_leds
      - delay: 1s
      - switch.turn_on: internal_speaker_amp
      - speaker.volume_set:
          id: i2s_audio_speaker
          volume: !lambda return id(speaker_volume);
      # Wake word: listen for "hey friday" while idle.
      - micro_wake_word.enable_model: hey_friday
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: ${hidden_ssid}
  on_connect:
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

logger:
  level: DEBUG
  logs:
    sensor: WARN

api:
  id: api_id
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

external_components:
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: dev
    components:
      - voice_kit
    refresh: 0s
  - source:
      type: local
      path: components

globals:
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: speaker_volume
    type: float
    restore_value: yes
    initial_value: '0.6'

# ---------------------------------------------------------------- Friday

friday_client:
  id: friday
  url: ws://${friday_host}:${friday_port}/ws/audio
  device_id: ${name}
  microphone:
    microphone: i2s_mics
    # XMOS channel 1 (echo cancellation + noise suppression, no AGC). Channel 0 adds
    # automatic gain control, which amplifies residual echo of Friday's own voice
    # until Gemini hears it as a barge-in.
    channels: 1
    bits_per_sample: 16
  speaker: friday_speaker
  # Send silence for the first moment of each reply while the echo canceller converges.
  barge_in_delay: 1500ms
  on_state:
    - logger.log:
        format: "friday state: %s"
        args: [state.c_str()]
    - script.execute: control_leds
    # Only listen for the wake word while idle (see openspec design for wake-word).
    - if:
        condition:
          lambda: return id(friday).get_state() == friday_client::State::IDLE;
        then:
          - micro_wake_word.enable_model: hey_friday
        else:
          - micro_wake_word.disable_model: hey_friday

# On-device wake word detection. Nothing is sent to the server until it fires.
# "hey friday" is a community model (Apache-2.0) from
# https://github.com/JohnnyPrimus/Custom_V2_MicroWakeWords, trained on request in
# https://community.home-assistant.io/t/803409. Pinned to a commit for
# reproducible builds; swap the model line to e.g. `model: hey_jarvis` to change
# the phrase. Channel 1 / gain 4 mirrors the upstream firmware's wake word feed.
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  vad:
  models:
    - model: github://JohnnyPrimus/Custom_V2_MicroWakeWords/models/hey_friday/hey_friday.json@2987c5ae4e4c8e7ac277bdede0904d99b4ed477a
      id: hey_friday
      # Model default cutoff 0.66: zero false triggers in a 10 min soak, detections score 0.67-0.75.
      # Lower toward 0.55 if it misses, raise if it wakes on its own.
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          - friday_client.chime: friday
          - friday_client.start: friday

# ---------------------------------------------------------------- Controls

switch:
  # Software mute, exposed to HA. The hardware switch on the side overrides it.
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute
    entity_category: config
    lambda: |-
      return id(hardware_mute_switch).state || id(i2s_mics).get_mute_state();
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute:
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute:
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds
  - platform: gpio
    pin: GPIO47
    id: internal_speaker_amp
    name: "Internal speaker amp"
    entity_category: config
    restore_mode: ALWAYS_OFF
    internal: true

binary_sensor:
  # Centre button: single click toggles the Friday session. Other gestures are
  # intentionally not bound (upstream double/triple/long press removed).
  - platform: gpio
    id: center_button
    pin:
      number: GPIO0
      inverted: true
    on_press:
      - script.execute: control_leds
    on_release:
      - script.execute: control_leds
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                switch.is_on: master_mute_switch
              then:
                - friday_client.error: friday
              else:
                - friday_client.toggle: friday

  # Hardware mute switch (side of the device). It cuts the microphones in
  # hardware; this sensor only reports it.
  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin: GPIO3
    on_press:
      - script.execute: control_leds
    on_release:
      - microphone.unmute:
      - script.execute: control_leds

sensor:
  # The dial controls the speaker volume.
  - platform: rotary_encoder
    id: dial
    pin_a: GPIO16
    pin_b: GPIO18
    resolution: 2
    on_clockwise:
      - script.execute:
          id: control_volume
          increase_volume: true
    on_anticlockwise:
      - script.execute:
          id: control_volume
          increase_volume: false

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

# ---------------------------------------------------------------- Audio

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3204_dac

  # Mixer upmixes mono sources to the stereo output. It needs two sources;
  # the second is reserved for notification sounds and unused today.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: friday_mixing_input
        timeout: never
      - id: aux_mixing_input
        timeout: never

  # Friday sends 24 kHz mono 16-bit; the resampler brings it to 48 kHz.
  - platform: resampler
    id: friday_speaker
    output_speaker: friday_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 2000ms

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  reset_pin: GPIO4
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: "1.3.1"
    md5: 964635c5bf125529dab14a2472a15401

# ---------------------------------------------------------------- LEDs

power_supply:
  - id: led_power
    pin: GPIO45

light:
  - platform: esp32_rmt_led_strip
    id: leds_internal
    pin: GPIO21
    bit0_high: 300ns
    bit0_low: 975ns
    bit1_high: 650ns
    bit1_low: 650ns
    reset_low: 300us
    reset_high: 0us
    max_refresh_rate: 15ms
    num_leds: 12
    channel_colors: GRB
    rmt_symbols: 192
    default_transition_length: 0ms
    power_supply: led_power

  # Device-controlled ring (remapped so LED 0 is at the front).
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6
    effects:
      - addressable_lambda:
          name: "Connecting"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Listening"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Speaking"
          update_interval: 50ms
          lambda: |-
            id(global_led_animation_index) = (12 + id(global_led_animation_index) - 1) % 12;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == (id(global_led_animation_index)) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 1) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 2) % 12) {
                it[i] = color * 128;
              } else if (i == ( id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 7) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 8) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Muted"
          update_interval: 16ms
          lambda: |-
            Color muted_color(255, 0, 0);
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = light_color.get_state() ? color : Color::BLACK;
            }
            it[2] = Color::BLACK;
            it[3] = muted_color;
            it[4] = Color::BLACK;
            it[8] = Color::BLACK;
            it[9] = muted_color;
            it[10] = Color::BLACK;
      - addressable_lambda:
          name: "Voice kit startup failed"
          lambda: |-
            Color fail_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = (i % 3) ? Color::BLACK : fail_color;
            }
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            auto volume_ratio = 12.0f * id(speaker_volume);
            for (uint8_t i = 0; i < 12; i++) {
              if (i <= volume_ratio) {
                it[(6+i)%12] = color * min( 255.0f * (volume_ratio - i) , 255.0f ) ;
              } else {
                it[(6+i)%12] = Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Center Button Touched"
          update_interval: 16ms
          lambda: |-
            if (initial_run) {
              auto led_ring_cv = id(led_ring).current_values;
              auto va_leds_call = id(voice_assistant_leds).make_call();
              va_leds_call.from_light_color_values(led_ring_cv);
              va_leds_call.set_brightness( min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f ) );
              va_leds_call.set_state(true);
              va_leds_call.perform();
            }
            auto light_color = id(voice_assistant_leds).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color;
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%

  # User-facing ring, exposed to HA for colour and brightness.
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6

script:
  # Picks the LED pattern from device state. Called on every state change.
  - id: control_leds
    then:
      - lambda: |
          if (id(voice_kit_component).is_failed()) {
            id(control_leds_voice_kit_startup_failed).execute();
            return;
          }
          if (!id(wifi_id).is_connected()) {
            id(control_leds_no_wifi).execute();
            return;
          }
          if (id(center_button).state) {
            id(control_leds_center_button_touched).execute();
            return;
          }
          if (id(dial_touched)) {
            id(control_leds_dial_touched).execute();
            return;
          }
          switch (id(friday).get_state()) {
            case friday_client::State::CONNECTING: id(control_leds_connecting).execute(); return;
            case friday_client::State::LISTENING:  id(control_leds_listening).execute();  return;
            case friday_client::State::SPEAKING:   id(control_leds_speaking).execute();   return;
            case friday_client::State::ERROR:      id(control_leds_error).execute();      return;
            default: break;
          }
          if (id(master_mute_switch).state) {
            id(control_leds_muted).execute();
            return;
          }
          id(control_leds_idle).execute();

  - id: control_leds_voice_kit_startup_failed
    then:
      - light.turn_on:
          brightness: 40%
          id: voice_assistant_leds
          effect: "Voice kit startup failed"
  - id: control_leds_no_wifi
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 89%
          blue: 71%
          id: voice_assistant_leds
          effect: "Twinkle"
  - id: control_leds_idle
    then:
      - light.turn_off: voice_assistant_leds
      - if:
          condition:
            light.is_on: led_ring
          then:
            light.turn_on: led_ring
  - id: control_leds_connecting
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Connecting"
  - id: control_leds_listening
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Listening"
  - id: control_leds_speaking
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Speaking"
  - id: control_leds_error
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Error"
  - id: control_leds_muted
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Muted"
  - id: control_leds_dial_touched
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Volume Display"
  - id: control_leds_center_button_touched
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Center Button Touched"

  # Dial: step the DAC volume between 0.4 and 0.85 (upstream's usable range).
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      - lambda: |-
          float v = id(speaker_volume) + (increase_volume ? 0.05f : -0.05f);
          id(speaker_volume) = clamp(v, 0.4f, 0.85f);
          id(dial_touched) = true;
      - speaker.volume_set:
          id: i2s_audio_speaker
          volume: !lambda return id(speaker_volume);
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds
